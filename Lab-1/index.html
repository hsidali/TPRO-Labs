<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="color-scheme" content="light dark" />
    <meta name="description" content="Finds the shortest cycle of an undirected graph with a BFS from every vertex and animates the algorithm step by step." />
    <title>Shortest Cycle Finder</title>
    <script>
      // Apply a saved light/dark choice before first paint (no flash of the wrong theme).
      try {
        var t = localStorage.getItem('shortest-cycle-finder:theme');
        if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
      } catch (e) {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
